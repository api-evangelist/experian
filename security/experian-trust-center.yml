trust_center:
  published: false
  url: null
  note: 'Experian operates no trust center in the modern sense — no trust.experian.com, no
    self-service portal serving SOC 2 reports, pen-test summaries or a live sub-processor list, and
    no downloadable evidence behind an NDA click-through. What it publishes instead is a Request for
    Information (RFI) page per product, which is a structured security questionnaire response: it
    answers the standard due-diligence questions in prose and names the certifications, but gates the
    evidence itself. Recorded as published: false because the artifact a buyer or an agent can
    actually read is an RFI page, not a trust center.'
