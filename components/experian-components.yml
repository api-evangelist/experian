note: 'Experian ships client-side surfaces in two very different shapes. Experian Consumer Services
  publishes "Embedded Experiences" as a versioned npm web SDK — a genuine drop-in component library,
  actively released. Experian Data Quality instead ships address-capture as browser libraries
  distributed only as GitHub source, plus a long list of pre-built connectors for enterprise commerce
  and CRM platforms, which are installable applications rather than developer components. None of the
  Data Quality browser libraries is published to a package registry or a CDN with a pinned URL, so a
  consumer cannot version-pin what they embed — they clone and build. That is the finding.'
