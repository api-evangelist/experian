generated: '2026-09-13'
method: searched
source: https://docs.experianaperture.io/end-of-service-life-status, https://docs.experianaperture.io/saas-services-sla,
  https://status.edq.com/, https://docs.experianaperture.io/more/product-roadmap/
note: 'Experian Data Quality is unusually strong on lifecycle for an enterprise data vendor: a named
  End of Service Life policy with a public table of 60+ dated product retirements, a numeric SaaS SLA
  with uptime and support-resolution targets, a dated forward roadmap, and a live status page. What
  is absent is the runtime half — no Deprecation or Sunset response headers (RFC 8594) are documented
  on any endpoint, and no operation in the published OpenAPI carries deprecated: true. The policy
  lives on web pages an agent must read; nothing reaches the caller in-band.'
versioning:
  scheme: path
  note: Version is a path segment on every Aperture endpoint (/address/search/v1, /email/validate/v2,
    /enrichment/v2, /address/layouts/v2). Multiple major versions run side by side — email validation
    is documented at both v1 (EOSL 30-Apr-2026) and v2, address layouts at v1 and v2. The SOAP
    surface versions by path too (ProOnDemand/V1, /V2, /V3) with V3 the recommended endpoint.
  current:
  - api: Experian Address Validation
    version: v1 / v2 (per-operation)
  - api: Experian Email Validation
    version: v2 (v1 retiring 30-Apr-2026)
  - api: Experian Phone Validation
    version: v2
  - api: Experian Enrichment
    version: v2
  - api: Experian Address Validate SOAP
    version: V3
