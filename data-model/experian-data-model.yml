note: 'The Experian Data Quality model has an unusual centre of gravity. There is no user, account,
  customer or subscription object anywhere in the contract — entitlement lives entirely in the
  Auth-Token and never appears as a resource. What the model is actually built around is one durable
  identifier, global_address_key, which is the handle a search returns and every subsequent
  operation consumes. The rest of the graph is either configuration the caller owns (layouts,
  prompt sets), reference data Experian owns (datasets), or asynchronous job state (batches).
  Relationships are expressed by identifier reference in request and response bodies, not by
  hypermedia links or $ref-linked resources, so the graph below is derived from id-bearing fields
  and path parameters.'
