apis:
- aid: experian:aperture
  name: Experian Aperture Data Quality API
  description: 'The consolidated Experian Data Quality REST API — 41 operations across
    34 paths covering address search/validate/format/layouts, email validation, phone
    validation, demographic enrichment, identity append, reverse phone append and the
    bulk batch surface for address, email and phone. Published as OpenAPI 3.0.4 at
    api.experianaperture.io/docs/openapi.json.'
  humanURL: https://docs.experianaperture.io/
  baseURL: https://api.experianaperture.io
  tags:
  - Data Quality
  - Address Validation
  - Email Validation
  - Phone Validation
  - Data Enrichment
  properties:
  - type: OpenAPI
    url: openapi/experian-aperture-openapi.json
  - type: Documentation
    url: https://docs.experianaperture.io/
  - type: APIReference
    url: https://docs.experianaperture.io/address-validation/experian-address-validation/realtime-api-reference/api-specification/
  - type: Console
    url: https://api.experianaperture.io/docs
- aid: experian:address-validation
  name: Experian Address Validation API
  description: Real-time international address capture and validation — autocomplete,
    typedown, single-line, lookup and validate search types across 245+ countries,
    with custom layouts, prompt sets, dataset discovery and what3words reverse geocoding.
  humanURL: https://docs.experianaperture.io/address-validation/experian-address-validation/
  baseURL: https://api.experianaperture.io
  tags:
  - Address Validation
  - Geocoding
  properties:
  - type: OpenAPI
    url: openapi/experian-addressvalidation-openapi.json
  - type: Documentation
    url: https://docs.experianaperture.io/address-validation/experian-address-validation/
- aid: experian:email-validation
  name: Experian Email Validation API
  description: Real-time email address verification returning a confidence classification
    (verified, unknown, undeliverable, illegitimate) with optional metadata about the
    mailbox and domain.
  humanURL: https://docs.experianaperture.io/email-validation/experian-email-validation-v2
  baseURL: https://api.experianaperture.io
  tags:
  - Email Validation
  properties:
  - type: OpenAPI
    url: openapi/experian-emailvalidationv2-openapi.json
  - type: Documentation
    url: https://docs.experianaperture.io/email-validation/experian-email-validation-v2
- aid: experian:phone-validation
  name: Experian Phone Validation API
  description: Real-time phone number validation and line-type identification across
    global numbering plans, returning formatted numbers, carrier and connectivity signals.
  humanURL: https://docs.experianaperture.io/phone-validation/experian-phone-validation
  baseURL: https://api.experianaperture.io
  tags:
  - Phone Validation
  properties:
  - type: OpenAPI
    url: openapi/experian-phonevalidation-openapi.json
  - type: Documentation
    url: https://docs.experianaperture.io/phone-validation/experian-phone-validation
- aid: experian:enrichment
  name: Experian Enrichment API
  description: Appends demographic, geodemographic, location-insight and property attributes
    to a validated address or identity key, including Mosaic segmentation and Global
    Location Insight geocoding.
  humanURL: https://docs.experianaperture.io/data-resources/global-datasets/
  baseURL: https://api.experianaperture.io
  tags:
  - Data Enrichment
  - Demographics
  properties:
  - type: OpenAPI
    url: openapi/experian-enrichment-openapi.json
- aid: experian:identity-append
  name: Experian Identity Append API
  description: Returns additional contact and identity attributes for a known individual
    or household, including reverse phone append lookups.
  humanURL: https://docs.experianaperture.io/identity-append/experian-identity-append/
  baseURL: https://api.experianaperture.io
  tags:
  - Identity Verification
  - Data Enrichment
  properties:
  - type: OpenAPI
    url: openapi/experian-identityappend-openapi.json
- aid: experian:bulk-validation
  name: Experian Bulk Validation API
  description: Asynchronous batch surface for address, email and phone validation —
    create a batch, start it, poll status and retrieve results, with up to 10,000 records
    per address batch.
  humanURL: https://docs.experianaperture.io/address-validation/experian-address-validation/bulk-api-reference/api-specification/
  baseURL: https://api.experianaperture.io
  tags:
  - Batch Processing
  - Data Quality
  properties:
  - type: OpenAPI
    url: openapi/experian-bulkaddress-openapi.json
  - type: Documentation
    url: https://docs.experianaperture.io/address-validation/experian-address-validation/bulk-api-reference/api-specification/
- aid: experian:address-validate-soap
  name: Experian Address Validate (Pro OnDemand SOAP)
  description: The legacy Experian QAS Pro OnDemand SOAP service, still published and
    documented by Experian Data Quality. Eleven RPCs (DoSearch, DoRefine, DoGetAddress,
    DoCanSearch, DoGetLayouts, DoGetPromptSet, DoGetData, DoGetDataMapDetail, DoGetExampleAddresses,
    DoGetLicenseInfo, DoGetSystemInfo) over SOAP 1.1/1.2.
  humanURL: https://docs.experianaperture.io/address-validation/address-validate-soap/
  baseURL: https://ws.ondemand.qas.com/ProOnDemand/V3/ProOnDemandService.asmx
  tags:
  - Address Validation
  - SOAP
  properties:
  - type: WSDL
    url: wsdl/experian-proondemand-v3.wsdl
  - type: Documentation
    url: https://docs.experianaperture.io/address-validation/address-validate-soap/
  - type: APIReference
    url: https://docs.experianaperture.io/address-validation/address-validate-soap/api-reference/api-specification/
- aid: experian:global-developer-platform
  name: Experian Global Developer Platform
  description: 'The region-partitioned Experian API gateway behind developer.experian.com,
    fronting credit, business information, KYC/KYB, decisioning and verification products.
    Each region runs its own OAuth2/OIDC issuer and production/sandbox host pair: us-api,
    uk-api, eu-api, in-api, api.experian.com.au and api.experian.com.sg. Product API
    reference is gated behind a Developer Portal account; no public OpenAPI is published.'
  humanURL: https://developer.experian.com/products
  baseURL: https://us-api.experian.com
  tags:
  - Credit Reporting
  - Identity Verification
  - Decisioning
  properties:
  - type: DeveloperPortal
    url: https://developer.experian.com/
  - type: Documentation
    url: https://developer.experian.com/products
  - type: GettingStarted
    url: https://developer.experian.com/tutorials/quick-start-guide
