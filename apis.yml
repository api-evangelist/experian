apis:
- aid: experian:address-validate-soap
  name: Experian Address Validate (Pro OnDemand SOAP)
  description: >-
    The legacy Experian QAS Pro OnDemand SOAP service, still published and documented by Experian Data
    Quality. Eleven RPCs (DoSearch, DoRefine, DoGetAddress, DoCanSearch, DoGetLayouts, DoGetPromptSet,
    DoGetData, DoGetDataMapDetail, DoGetExampleAddresses, DoGetLicenseInfo, DoGetSystemInfo) over SOAP
    1.1/1.2.
  humanURL: https://docs.experianaperture.io/address-validation/address-validate-soap/
  baseURL: https://ws.ondemand.qas.com/ProOnDemand/V3/ProOnDemandService.asmx
  tags:
  - Address Validation
  - SOAP
  properties:
  - type: WSDL
    url: wsdl/experian-proondemand-v3.wsdl
  - type: Documentation
    url: https://docs.experianaperture.io/address-validation/address-validate-soap/
  - type: APIReference
    url: >-
      https://docs.experianaperture.io/address-validation/address-validate-soap/api-reference/api-specification/
- aid: experian:global-developer-platform
  name: Experian Global Developer Platform
  description: >-
    The region-partitioned Experian API gateway behind developer.experian.com, fronting credit, business
    information, KYC/KYB, decisioning and verification products. Each region runs its own OAuth2/OIDC
    issuer and production/sandbox host pair: us-api, uk-api, eu-api, in-api, api.experian.com.au and api.experian.com.sg.
    Product API reference is gated behind a Developer Portal account; no public OpenAPI is published.
  humanURL: https://developer.experian.com/products
  baseURL: https://us-api.experian.com
  tags:
  - Credit Reporting
  - Identity Verification
  - Decisioning
  properties:
