aid: experian
name: Experian
description: 'Experian plc is a global information services company and one of the
  three major consumer credit bureaus, operating across credit risk, identity verification,
  fraud prevention, marketing data and data quality. Its public API surface spans two
  distinct platforms: the Experian Global Developer Portal (developer.experian.com),
  a region-partitioned OAuth2/OpenID Connect gateway fronting credit, business information,
  KYC/KYB and decisioning products across the US, UK, EMEA, Brazil, India, Singapore
  and Australia; and Experian Data Quality / Aperture (api.experianaperture.io), which
  publishes machine-readable OpenAPI 3.0.4 contracts for address, email and phone validation,
  demographic enrichment, identity append and bulk batch processing. A legacy SOAP
  contract (Experian QAS Pro OnDemand) remains published and callable alongside the
  REST surface.'
image: https://developer.experian.com/themes/custom/experian_devportal/logo.svg
url: https://raw.githubusercontent.com/api-evangelist/experian/refs/heads/main/apis.yml
