note: 'Experian Data Quality publishes dated, per-product release notes as documentation pages — not
  a feed, not a machine-readable changelog, and with no RSS or Atom. Entries are prose descriptions
  of what shipped, dated to the day. No version numbers are attached to entries; the API itself
  versions by path segment, so a release note describes a behavioural change inside an existing
  version rather than a new one. The window below is the recent set from the Address Validation
  notes, the most active of the product changelogs. The Global Developer Platform
  (developer.experian.com) publishes no changelog at all.'
