note: 'Experian ships first-party client code from three separate org identities — @experian-ecs
  (Experian Consumer Services, npm, actively released), experianplc / experiandataquality (GitHub
  source-only), and Experian plc on NuGet (a 2018-era Business Information Services client). The
  headline finding is a distribution gap, not an absence: the current Data Validation Solutions SDKs
  (.NET, Java, TypeScript) are published only as source in a GitHub monorepo — the TypeScript package
  manifest names itself "@experianplc/edq.dvs.sdk" at version 0.0.1 but that name resolves to 404 on
  npm, and no matching artifact exists on NuGet or Maven Central. A consumer cannot `npm install` or
  `dotnet add package` the SDK Experian tells them to use; they must clone and build it.'
