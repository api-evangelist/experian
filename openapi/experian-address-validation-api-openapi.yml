                  prompt_set: generic
              United Kingdom:
                value:
                  country_iso: GBR
                  datasets:
                  - gb-additional-business
                  search_type: singleline
                  prompt_set: alternate
              United States:
                value:
                  country_iso: USA
                  datasets:
                  - us-address
                  search_type: typedown
                  prompt_set: default
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddressPromptSetsV1Response'
              examples:
                Australia:
                  value:
                    result:
                      lines:
                      - prompt: Building Number or Name
