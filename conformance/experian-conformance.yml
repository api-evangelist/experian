domain_standards:
- id: e164
  name: ITU-T E.164 international telephone numbering plan
  conforms: true
  evidence: 'The phone validation and bulk-phone request schemas declare an output_format enumeration
    whose values include PLUS_E164 — for example
    components.schemas.BulkPhoneV1CreateBatchRequest, example GBR: {"defaults": {"output_format":
    "PLUS_E164", "country_iso": "GBR"}}. 14 occurrences of E164 across openapi/experian-aperture-openapi.json.'
  market: telephony / contact data
  note: The contract lets a caller ask for numbers normalised into the international standard rather
    than a vendor-specific format. An integrator who already speaks E.164 needs no adapter.
- id: iso-3166-1-alpha-3
  name: ISO 3166-1 alpha-3 country codes
  conforms: true
  evidence: country_iso appears 260 times across openapi/experian-aperture-openapi.json, with
    three-letter values throughout the examples (GBR, USA, AUS, CAN, NZL). Country is the primary
    partitioning dimension of every dataset in the address, phone and enrichment surfaces.
  market: international address and contact data
- id: uk-paf-uprn
  name: Royal Mail PAF and Unique Property Reference Number (UPRN)
  conforms: true
  evidence: UPRN appears 41 times and PAF 20 times in openapi/experian-aperture-openapi.json; the UK
    dataset reference documents both, and the Emergency Services proposition (11 March 2025 release)
    supports UPRN search explicitly. A Royal Mail PAF EULA is listed among Experian's published
    standard terms.
  market: UK addressing
  note: UPRN is the UK public-sector canonical property identifier. Returning it is what makes this
    API joinable to local-authority and Ordnance Survey data without a bespoke match step.
