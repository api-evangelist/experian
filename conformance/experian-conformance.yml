domain_standards_absent:
  note: 'No credit-reporting data standard is declared anywhere in the published contract. This is
    the significant absence for a company of this kind. Experian is one of three US consumer
    reporting agencies and the furnisher-facing exchange format in that market is Metro 2 (CDIA); the
    UK equivalents run through SCOR. Neither appears in any public Experian API artifact, because the
    credit surface — the Global Developer Platform — publishes no machine-readable contract at all.
    Recorded as an absence, not a failure: the standard exists in Experian''s business, just not in
    anything it publishes for a machine to read.'
